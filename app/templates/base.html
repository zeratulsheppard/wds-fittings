<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WDS Fittings{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ request.state.static_version }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="https://images.evetech.net/alliances/99006319/logo?size=128" alt="WDS" class="logo">
        <div class="brand-text">
          <span class="brand-name">WiNGSPAN Delivery Services</span>
          <span class="brand-sub">Fittings</span>
        </div>
      </div>
      <nav class="header-nav">
        <a href="/" class="nav-link">Browse</a>
        <a href="/import" class="nav-link">Import</a>
      </nav>
      <div class="header-right">
        {% if user %}
        <div class="character">
          <img src="https://images.evetech.net/characters/{{ user.character_id }}/portrait?size=64"
               alt="{{ user.character_name }}" class="avatar" onerror="this.style.display='none'">
          <span class="char-name">{{ user.character_name }}</span>
        </div>
        <form method="POST" action="/sso/logout" style="margin:0">
          <button class="logout-btn" type="submit">Log out</button>
        </form>
        {% endif %}
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
